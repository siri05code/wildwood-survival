plugins { id 'com.android.application' }

android {
    namespace 'com.wildwoodsurvival.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wildwoodsurvival.game'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
}
